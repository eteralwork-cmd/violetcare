<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Christmas Look</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: a 2x2 grid of product tiles, each with a Shop button underneath. */
:root {
  --bg: #f6ead8;
  --card: #fffaf2;
  --tile: #ffffff;
  --fg: #2a1b14;
  --muted: #6b5547;
  --accent: #8e0b1f;
  --on-accent: #fff6ea;
  --line: #e6d5bb;
  --font-display: 'Fraunces', Georgia, serif;
  --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b100e; --card: #2a1a16; --fg: #f4e8d8; --muted: #c2ab99;
    --accent: #e8647a; --on-accent: #1b100e; --line: #4a3128; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b100e; --card: #2a1a16; --fg: #f4e8d8; --muted: #c2ab99;
  --accent: #e8647a; --on-accent: #1b100e; --line: #4a3128; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body);
  font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 48px 64px;
}
main { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px; }
header { display: flex; flex-direction: column; gap: 8px; }
h1 {
  margin: 0; font-family: var(--font-display); font-style: italic; font-weight: 400;
  font-size: clamp(2.5rem, 7vw, 3.5rem); line-height: 1.1; color: var(--accent); text-wrap: balance;
}
header p { margin: 0; font-size: 1.15rem; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.photo { background: var(--tile); height: 340px; display: flex; align-items: center; justify-content: center; padding: 10px; }
.photo img { height: 100%; width: auto; max-width: 100%; object-fit: contain; display: block; }
.info { padding: 16px 24px 24px; display: flex; flex-direction: column; gap: 16px; flex: 1; }
.label { font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.name { font-size: 1.25rem; font-weight: 500; line-height: 1.3; margin-top: 4px; }
.shop {
  margin-top: auto; display: flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 12px 20px; border-radius: 999px;
  background: var(--accent); color: var(--on-accent); font-weight: 600; font-size: 1rem;
  text-decoration: none; border: 2px solid var(--accent);
}
.shop:hover { filter: brightness(1.08); }
.shop:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
.shop svg { width: 18px; height: 18px; flex: none; }
/* shown while a link has not been added yet */
.shop[aria-disabled="true"] { background: transparent; color: var(--muted); border: 2px dashed var(--line); cursor: not-allowed; filter: none; }
@media (max-width: 600px) {
  body { padding-block: 32px 48px; }
  .grid { grid-template-columns: minmax(0, 1fr); }
  .photo { height: 300px; }
}
@media (prefers-reduced-motion: no-preference) { .shop { transition: filter .15s ease; } }
</style>

</head>
